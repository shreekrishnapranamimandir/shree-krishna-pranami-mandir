<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>फोटो गैलरी | श्री राधा कृष्ण प्रणामी मंदिर</title>
<meta name="description" content="श्री राधा कृष्ण प्रणामी मंदिर (परमहंस पीठ सत्संग धाम), राजापुर, पटना की फोटो गैलरी।">
<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial,"Noto Sans Devanagari",sans-serif;
    color:#3d2415;
    background:#fffaf0;
    line-height:1.65;
}

/* ================= HEADER ================= */

header{
    position:sticky;
    top:0;
    z-index:1000;
    background:rgba(255,250,240,.97);
    backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(165,117,45,.25);
    box-shadow:0 4px 20px rgba(70,35,10,.12);
}

.nav{
    max-width:1200px;
    margin:auto;
    padding:10px 22px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:25px;
}

.logo{
    display:flex;
    align-items:center;
    gap:14px;
}

/* Radha Krishna logo */
.logo-mark{
    width:62px;
    height:62px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    background:#fff;
    border:2px solid #d5a52b;
    box-shadow:0 3px 12px rgba(130,80,15,.20);
}

.logo-mark img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.logo h2{
    font-size:21px;
    line-height:1.25;
    color:#7b170f;
    margin:0;
    font-weight:800;
}

.logo small{
    display:block;
    color:#8c5a25;
    font-size:13px;
    margin-top:3px;
}

nav a{
    text-decoration:none;
    color:#4c2d1d;
    margin-left:22px;
    font-weight:700;
    position:relative;
    transition:.3s;
}

nav a:hover{
    color:#a52b19;
}

nav a::after{
    content:"";
    position:absolute;
    left:0;
    bottom:-7px;
    width:0;
    height:2px;
    background:#d39b22;
    transition:.3s;
}

nav a:hover::after{
    width:100%;
}

/* ================= HERO ================= */

.hero{
    min-height:680px;
    display:grid;
    place-items:center;
    text-align:center;
    padding:90px 20px;
    position:relative;
    overflow:hidden;

    background:
    linear-gradient(
        120deg,
        rgba(80,20,8,.76),
        rgba(120,35,15,.60),
        rgba(70,20,8,.72)
    ),
    url("mandir-1.jpeg") center/cover no-repeat;

    color:white;
}

.hero::before{
    content:"";
    position:absolute;
    inset:18px;
    border:1px solid rgba(255,220,140,.55);
    pointer-events:none;
}

.hero-content{
    max-width:950px;
    position:relative;
    z-index:2;
    animation:fadeUp 1s ease;
}

.hero-content img{
    width:76px;
    height:76px;
    object-fit:contain;
    border-radius:50%;
    background:white;
    padding:4px;
    border:2px solid #e3b63b;
    box-shadow:0 8px 25px rgba(0,0,0,.25);
    margin-bottom:22px;
}

.hero h1{
    font-size:clamp(36px,6vw,68px);
    line-height:1.18;
    margin:8px 0 18px;
    color:#fff4c9;
    font-weight:900;
    text-shadow:0 4px 12px rgba(0,0,0,.45);
}

.hero p{
    font-size:clamp(17px,2vw,22px);
    color:#fff8e6;
    margin-bottom:28px;
}

/* ================= BUTTONS ================= */

.btn{
    display:inline-block;
    padding:13px 26px;
    margin:6px;
    border-radius:35px;
    text-decoration:none;
    font-weight:800;
    border:1px solid #e0ad35;
    background:linear-gradient(135deg,#f8d45a,#d99b1d);
    color:#5b280b;
    box-shadow:0 6px 18px rgba(70,30,5,.25);
    transition:.3s;
}

.btn:hover{
    transform:translateY(-3px);
    box-shadow:0 10px 25px rgba(70,30,5,.35);
}

.btn.alt{
    background:rgba(255,255,255,.08);
    color:white;
    border:1px solid rgba(255,220,150,.75);
    backdrop-filter:blur(5px);
}

.btn.alt:hover{
    background:rgba(255,255,255,.18);
}

/* ================= SECTIONS ================= */

section{
    padding:78px 20px;
}

.container{
    max-width:1120px;
    margin:auto;
}

.title{
    text-align:center;
    margin-bottom:42px;
}

.title span{
    color:#a52b19;
    font-weight:800;
}

.title h2{
    font-size:clamp(28px,4vw,42px);
    color:#652016;
    margin-top:6px;
}

.title p{
    max-width:700px;
    margin:10px auto 0;
    color:#725848;
}

/* ================= ABOUT ================= */

.about{
    display:grid;
    grid-template-columns:1.1fr .9fr;
    gap:35px;
    align-items:center;
}

.card{
    background:white;
    border-radius:20px;
    padding:30px;
    box-shadow:0 8px 30px rgba(80,40,10,.10);
    border:1px solid rgba(165,117,45,.18);
}

.card h3{
    color:#7d2115;
    margin-bottom:12px;
}

/* ================= FEATURES ================= */

.features{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:22px;
}

.feature{
    text-align:center;
    padding:30px 22px;
    background:white;
    border-radius:20px;
    box-shadow:0 8px 25px rgba(80,40,10,.10);
    border-top:4px solid #d5a52b;
    transition:.3s;
}

.feature:hover{
    transform:translateY(-7px);
    box-shadow:0 14px 30px rgba(80,40,10,.17);
}

.feature h3{
    color:#752116;
    margin-bottom:8px;
}

/* ================= EVENTS ================= */

.events{
    background:#fff4df;
}

.event-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:22px;
}

.event{
    padding:25px;
    background:white;
    border-radius:18px;
    box-shadow:0 7px 24px rgba(80,40,10,.10);
    border-left:4px solid #d5a52b;
}

.event h3{
    color:#7b2015;
    margin-bottom:8px;
}

/* ================= GALLERY ================= */

.gallery{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.gallery figure{
    margin:0;
    overflow:hidden;
    border-radius:18px;
    background:white;
    box-shadow:0 7px 25px rgba(80,40,10,.15);
}

.gallery img{
    width:100%;
    height:230px;
    object-fit:cover;
    display:block;
    transition:.5s;
}

.gallery figure:hover img{
    transform:scale(1.06);
}

/* ================= CONTACT ================= */

.contact{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:25px;
}

.contact .card a{
    color:#8c2417;
    text-decoration:none;
    font-weight:700;
}

/* ================= FOOTER ================= */

footer{
    background:#4c160e;
    color:#fff1d0;
    text-align:center;
    padding:30px 20px;
}

footer p{
    margin:5px 0;
}

/* ================= ANIMATION ================= */

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(25px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* ================= MOBILE ================= */

@media(max-width:768px){

    .nav{
        padding:8px 12px;
    }

    .logo-mark{
        width:52px;
        height:52px;
    }

    .logo h2{
        font-size:14px;
    }

    .logo small{
        font-size:10px;
    }

    nav a{
        margin-left:9px;
        font-size:12px;
    }

    .hero{
        min-height:600px;
        padding:70px 15px;
    }

    .hero::before{
        inset:10px;
    }

    .hero h1{
        font-size:34px;
    }

    .hero p{
        font-size:16px;
    }

    .about,
    .contact{
        grid-template-columns:1fr;
    }

    .features,
    .event-grid,
    .gallery{
        grid-template-columns:1fr;
    }

    .gallery img{
        height:240px;
    }
}

@media(max-width:520px){

    .nav{
        flex-direction:column;
        gap:7px;
    }

    nav{
        padding-bottom:5px;
    }

    nav a{
        margin:0 5px;
        font-size:11px;
    }

    .hero{
        min-height:570px;
    }

    .hero h1{
        font-size:30px;
    }

    .hero-content img{
        width:65px;
        height:65px;
    }

    section{
        padding:55px 15px;
    }
}
    /* ================= MOBILE SCREEN FIX ================= */

html,
body{
    width:100%;
    max-width:100%;
    overflow-x:hidden;
}

img{
    max-width:100%;

section,
header,
footer{

.container{
    width:100%;

/* Mobile */

    }

    nav{

        display:flex;

        justify-content:center;
    }

    nav a{
        white-space:nowrap;

    .hero{
        width:100%;
        max-width:100%;
        min-height:560px;
        padding:70px 15px;
        background-size:cover;
        background-position:center center;
    }

    .hero-content{
        width:100%;
        max-width:100%;
    }

    .hero h1{
        max-width:100%;
        word-wrap:break-word;
    }

    .hero p{
        max-width:100%;
        word-wrap:break-word;
    }

    .about,
    .features,
    .event-grid,
    .gallery,
    .contact{
        width:100%;
        max-width:100%;
    }

    .card,
    .feature,
    .event{
        max-width:100%;
        overflow:hidden;
    }

    .gallery img{
        max-width:100%;
    }

    /* Digital Granth */
    #granth{
        width:100%;
        max-width:100%;
        overflow:hidden;
    }

    #granth .container{
        padding-left:0;
        padding-right:0;
    }
}

</style>

<div class="photo-overlay" id="photoOverlay">
  <span class="photo-close" onclick="closePhoto()">×</span>
  <img id="fullPhoto" src="" alt="बड़ी तस्वीर">
</div>

<script>
const galleryImages = document.querySelectorAll('.gallery img');
const photoOverlay = document.getElementById('photoOverlay');
const fullPhoto = document.getElementById('fullPhoto');

galleryImages.forEach(function(image){
  image.addEventListener('click', function(){
    fullPhoto.src = this.src;
    fullPhoto.alt = this.alt;
    photoOverlay.classList.add('active');
  });
});

function closePhoto(){
  photoOverlay.classList.remove('active');
  fullPhoto.src = "";
}

photoOverlay.addEventListener('click', function(event){
  if(event.target === photoOverlay){
    closePhoto();
  }
});
</script>
